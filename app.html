<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrashIt</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
        }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 90%;
            max-width: 800px;
            text-align: center;
            padding-top: 8vh;
        }

        h1 {font-size:6rem;color:#ff0000;margin:0 0 20px 0;letter-spacing:4px;text-shadow:0 0 20px rgba(255,0,0,0.4);}
        .catchphrase {font-size:1.8rem;margin:30px 0 50px 0;min-height:60px;transition:opacity .6s;}
        .input-container {position:relative;margin-bottom:0;max-width:620px;margin-left:auto;margin-right:auto;}
        #trashInput {width:100%;max-width:620px;padding:20px 60px 20px 25px;font-size:1.4rem;background:#333;color:#fff;border:3px solid #ff0000;border-radius:20px;outline:none;box-sizing:border-box;}
        #trashInput::placeholder {color:#999;}
        .clear-btn {position:absolute;right:12px;top:50%;transform:translateY(-50%);background:#ffff00;color:#000;border:none;width:42px;height:42px;border-radius:50%;font-size:28px;font-weight:bold;cursor:pointer;display:flex;align-items:center;justify-content:center;}
        .clear-btn:hover {background:#ffff66;}
        .last-week {background:#1a0000;border:3px solid #ff0000;border-radius:20px;padding:30px;margin:40px auto 10vh;max-width:620px;}
        .last-week h2 {margin:0 0 20px 0;font-size:2.2rem;color:#ffff00;}
        .last-week p {margin:0;font-size:1.8rem;color:#ffff00;}
        .submit-wrapper {max-width:620px;margin:20px auto 0;text-align:center;}
        .submit-btn {width:200px;padding:16px 0;font-size:1.4rem;font-weight:bold;color:#fff;background:#ff0000;border:none;border-radius:16px;cursor:pointer;transition:all .3s;}
        .submit-btn:disabled {background:#660000;cursor:not-allowed;}
        #timer {margin-top:8px;font-size:14px;color:#ff3366;font-weight:bold;}
        .lists-wrapper {display:flex;gap:40px;width:90%;max-width:1000px;margin:80px auto 0;flex-wrap:wrap;justify-content:center;}
        .trash-column {flex:1;min-width:300px;}
        .column-title {font-size:2rem;font-weight:bold;text-align:center;margin-bottom:20px;}
        .this-week {color:#ff8800;}
        .previous {color:#ffff00;}
        .trash-list {background:#222;border-radius:16px;padding:20px;max-height:60vh;overflow-y:auto;}
        .trash-item {color:#fff;font-size:1.3rem;padding:12px 0;border-bottom:1px solid #333;cursor:pointer;transition:background .2s;}
        .trash-item:hover {background:#333;border-radius:8px;padding-left:10px;padding-right:10px;}
        .trash-item:last-child {border-bottom:none;}

        /* GLOWING VOTE BADGES — LOOKS ABSOLUTELY FIRE */
        .vote-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 42px;
            height: 42px;
            background: linear-gradient(135deg, #ff1744, #ff5500);
            color: white;
            font-weight: bold;
            font-size: 1.5rem;
            border-radius: 50%;
            margin-right: 16px;
            box-shadow: 0 0 20px rgba(255, 23, 68, 0.7);
            flex-shrink: 0;
        }

        .phrase-text {
            line-height: 1.4;
        }

        .trash-item {
            display: flex;
            align-items: center;
            padding: 14px 0;
        }

        .trash-item:hover {
            background: #333;
            border-radius: 12px;
            padding-left: 12px;
            padding-right: 12px;
            margin: 0 -12px;
        }

        footer {
            background: #1c1c1c;
            padding: 20px 0;
            text-align: center;
        }
        footer a {
            color: #fff;
            text-decoration: none;
            margin: 0 30px;
            font-size: 1rem;
            opacity: 0.9;
        }
        footer a:hover {opacity: 1; text-decoration: underline;}

        @media (max-width:768px) {
            h1 {font-size:4rem;}
            .catchphrase {font-size:1.4rem;}
            #trashInput {font-size:1.2rem;}
            footer a {margin:0 15px;}
        }
        @media (max-width:480px) {
            footer a {display:block;margin:12px 0;}
        }
    </style>
</head>
<body>

    <main>
        <div class="container">
            <h1>TrashIt</h1>
            <div class="catchphrase" id="catchphrase">Tell the world how you feel.</div>

            <div class="input-container">
                <input type="text" id="trashInput" placeholder="Input your trash here." maxlength="140">
                <button class="clear-btn" id="clearBtn">X</button>
            </div>

            <div class="submit-wrapper">
                <button id="submitBtn" class="submit-btn">Submit</button>
                <div id="timer"></div>
            </div>

            <div class="last-week">
                <h2>Last Week's Trash</h2>
                <p id="winnerDisplay">Loading…</p>
            </div>

            <div class="lists-wrapper">
                <div class="trash-column">
                    <h2 class="column-title this-week">This Week's Trash</h2>
                    <div class="trash-list" id="thisWeekList"></div>
                </div>
                <div class="trash-column">
                    <h2 class="column-title previous">Previous Winners</h2>
                    <div class="trash-list" id="previousList"></div>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <a href="index.html">Home</a>
        <a href="contact.html">Contact</a>
        <a href="terms.html">Terms Of Service</a>
        <a href="privacy-policy.html">Privacy Statement</a>
    </footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const supabase = window.supabase.createClient(
        'https://cxcmaaawupyxtmkfapzf.supabase.co',
        'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN4Y21hYWF3dXB5eHRta2ZhcHpmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM1MzQ2MzEsImV4cCI6MjA3OTExMDYzMX0.kp3UG6HME7J-96e-KkcMErFJ5IWNqlFP87aGTwtFMds'
    );

    const winnerEl      = document.getElementById('winnerDisplay');
    const thisWeekEl    = document.getElementById('thisWeekList');
    const previousEl    = document.getElementById('previousList');
    const catchphraseEl = document.getElementById('catchphrase');
    const input         = document.getElementById('trashInput');
    const btn           = document.getElementById('submitBtn');
    const timerEl       = document.getElementById('timer');

    async function getCurrentPhaseId() {
        const { data } = await supabase
            .from('phases')               // ← CORRECT TABLE NAME
            .select('id')
            .eq('is_active', true)
            .single();

        return data?.id;
    }

    async function loadThisWeek() {
        const phaseId = await getCurrentPhaseId();

        const { data: phrases } = await supabase
            .from('phrases')
            .select('phrase_text')
            .eq('phase_id', phaseId);

        const votes = {};
        phrases?.forEach(p => {
            const t = p.phrase_text.trim();
            votes[t] = (votes[t] || 0) + 1;
        });

        const sorted = Object.entries(votes)
            .map(([text, count]) => ({ text, count }))
            .sort((a, b) => b.count - a.count);

        thisWeekEl.innerHTML = '';
        if (sorted.length === 0) {
            thisWeekEl.innerHTML = '<div class="trash-item" style="color:#888;text-align:center;padding:40px;font-style:italic;">No trash yet — be the first</div>';
            return;
        }

        sorted.forEach(item => {
            const el = document.createElement('div');
            el.className = 'trash-item';
            el.innerHTML = `
                <span class="vote-badge">${item.count}</span>
                <span class="phrase-text">${item.text.replace(/\n/g, '<br>')}</span>
            `;
            el.onclick = () => { input.value = item.text; input.focus(); };
            thisWeekEl.appendChild(el);
        });
    }

    async function loadEverything() {
        // Last winner
        const { data: w } = await supabase
            .from('weekly_winners')
            .select('phrase_text')
            .order('created_at', { ascending: false })
            .limit(1);
        winnerEl.textContent = w?.[0]?.phrase_text?.trim() || 'No winner yet';

        // Previous winners
        const { data: all } = await supabase
            .from('weekly_winners')
            .select('phrase_text')
            .order('created_at', { ascending: false });
        previousEl.innerHTML = '';
        all?.forEach(x => {
            const el = document.createElement('div');
            el.className = 'trash-item';
            el.textContent = x.phrase_text.trim();
            el.onclick = () => { input.value = x.phrase_text.trim(); input.focus(); };
            previousEl.appendChild(el);
        });

        await loadThisWeek();

        // 24h cooldown
        const hash = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(navigator.userAgent + location.href))
            .then(b => Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join(''));

        const { data: last } = await supabase
            .from('phrases')
            .select('created_at')
            .eq('ip_hash', hash)
            .order('created_at', { ascending: false })
            .limit(1);

        if (last?.[0]) {
            const unlock = new Date(last[0].created_at).getTime() + 24*60*60*1000;
            if (Date.now() < unlock) {
                btn.disabled = true;
                btn.textContent = 'Locked';
                const left = Math.round((unlock - Date.now())/1000);
                timerEl.textContent = `Wait ${Math.floor(left/3600)}h ${Math.floor((left%3600)/60)}m`;
            }
        }
    }

    btn.onclick = async () => {
        const text = input.value.trim();
        if (!text || text.length > 140) return alert('1–140 characters only');

        btn.disabled = true;
        btn.textContent = 'Submitting…';

        try {
            const phaseId = await getCurrentPhaseId();

            const digest = await crypto.subtle.digest(
                'SHA-256',
                new TextEncoder().encode(navigator.userAgent + location.href)
            );
            const hash = Array.from(new Uint8Array(digest))
                .map(b => b.toString(16).padStart(2, '0'))
                .join('');

            const { error } = await supabase.from('phrases').insert({
                phrase_text: text,
                ip_hash: hash,
                phase_id: phaseId
            });

            if (error) throw error;

            input.value = '';
            btn.textContent = 'Submitted!';
            setTimeout(() => location.reload(), 1200);
        } catch (err) {
            alert('Error: ' + (err.message || 'Submission failed'));
            btn.disabled = false;
            btn.textContent = 'Submit';
        }
    };

    document.getElementById('clearBtn').onclick = () => input.value = '';

    const taglines = ["Tell the world how you feel.","Rant away, everyday!","Dump your trash here.","No filter, just feelings.","Let it all out."];
    let i = 0;
    setInterval(() => {
        i = (i + 1) % taglines.length;
        catchphraseEl.style.opacity = 0;
        setTimeout(() => {
            catchphraseEl.textContent = taglines[i];
            catchphraseEl.style.opacity = 1;
        }, 600);
    }, 5000);

    loadEverything();
</script>

</body>
</html>
